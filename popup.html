<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAM Saver PoC</title>
  <style>
    body { 
      width: 250px; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      padding: 15px; 
      text-align: center; 
      background-color: #ffffff;
      color: #000000;
    }
    button { 
      padding: 12px;

      background: #333333; 
    }
    #status { 
      margin-top: 15px;

      font-weight: 500; 
    }
  </style>
</head>
<body>
  <h2 style="font-size: 18px;">RAM Saver PoC</h2>

  <p id="status">Ready to test</p>
  <script src="popup.js"></script>

</html>
